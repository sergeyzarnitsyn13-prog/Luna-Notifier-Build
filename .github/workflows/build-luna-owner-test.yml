name: Build Luna Notify Windows Installer
on:
  workflow_dispatch:
  push:
    paths:
      - 'Luna.OwnerTest.csproj'
      - 'source/**'
      - 'scripts/**'
      - 'installer/**'
      - 'assets/**'
      - '.github/workflows/build-luna-owner-test.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Build portable Windows EXE
        shell: pwsh
        run: msbuild Luna.OwnerTest.csproj /nologo /p:Configuration=Release /p:RestorePackages=false
      - name: Validate WPF bubble
        shell: pwsh
        run: powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File scripts/Validate-Bubble.ps1
      - name: Smoke test local Systematic bridge
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $app=Start-Process -FilePath (Resolve-Path 'bin/Release/Luna.Notify.exe') -PassThru
          $origin='https://d5d8gka87mlca0b3tv6e.6brbn2wz.apigw.yandexcloud.net'
          $uri='http://127.0.0.1:58731'
          try {
            Start-Sleep -Seconds 1
            $health=Invoke-RestMethod "$uri/v1/health" -Headers @{ Origin=$origin } -TimeoutSec 3
            if(-not $health.ok -or $health.version -ne '0.9'){throw 'Health check failed'}
            $state=@{employeeName='Тестовый сотрудник';sessionId='local-test';todos=@(
              @{id='task-1';remindAt=([DateTimeOffset]::UtcNow.AddMinutes(3).ToString('o'));actionText='Проверить заказ';clientName='Тестовый клиент'}
            )} | ConvertTo-Json -Depth 6 -Compress
            $payload=[Text.Encoding]::UTF8.GetBytes($state)
            $response=Invoke-RestMethod "$uri/v1/state" -Method Post -Headers @{ Origin=$origin } -ContentType 'application/json; charset=utf-8' -Body $payload -TimeoutSec 3
            if(-not $response.ok){throw 'Task sync failed'}
            $mail=@{employeeName='Тестовый сотрудник';slotLabel='14:00–15:00';storageKey='test-mail-1'} | ConvertTo-Json -Compress
            $response=Invoke-RestMethod "$uri/v1/mail-notification" -Method Post -Headers @{ Origin=$origin } -ContentType 'application/json; charset=utf-8' -Body ([Text.Encoding]::UTF8.GetBytes($mail)) -TimeoutSec 3
            if(-not $response.ok){throw 'Mail notification failed'}
            $pending=Invoke-RestMethod "$uri/v1/pending-todos" -Headers @{ Origin=$origin } -TimeoutSec 3
            if($pending.todos.Count -ne 0){throw 'Unexpected pending local-origin todos'}
            try{
              $bad=Invoke-WebRequest "$uri/v1/health" -Headers @{ Origin='https://untrusted.example' } -SkipHttpErrorCheck -TimeoutSec 3
              if($bad.StatusCode -ne 403){throw 'Untrusted origin was accepted'}
            } catch {
              if($_.Exception.Message -notmatch '403'){throw}
            }
            Write-Host 'Luna localhost bridge smoke test PASSED (tasks, mail, no write actions, origin check)'
          } finally {
            Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
          }
      - name: Upload MoonGlow motion storyboard
        uses: actions/upload-artifact@v4
        with:
          name: Luna-MoonGlow-Animation-Frames
          path: animation-frames/*.png
          if-no-files-found: error
          retention-days: 7
      - name: Install Inno Setup compiler
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\\Inno Setup 6\\ISCC.exe")) {
            choco install innosetup --yes --no-progress --limit-output
          }
          if (-not (Test-Path "${env:ProgramFiles(x86)}\\Inno Setup 6\\ISCC.exe")) { throw "Inno Setup compiler missing" }
      - name: Build per-user installer
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\\Inno Setup 6\\ISCC.exe" "installer\\LunaNotify.iss"'
      - name: Validate installer and app hash
        shell: pwsh
        run: |
          Get-FileHash bin/Release/Luna.Notify.exe -Algorithm SHA256 | Format-List
          Get-FileHash installer-output/*.exe -Algorithm SHA256 | Format-List
          if (-not (Test-Path "installer-output/Luna-Notify-Setup-0.9.0.exe")) { throw "Missing installer" }
      - name: Smoke test per-user install, autorun and uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = (Resolve-Path "installer-output/Luna-Notify-Setup-0.9.0.exe").Path
          $app = Join-Path $env:LOCALAPPDATA "Programs\Luna Notify"
          $exe = Join-Path $app "Luna.Notify.exe"
          $runKey = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run"
          $install = Start-Process -FilePath $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Install failed with code $($install.ExitCode)" }
          if (-not (Test-Path $exe)) { throw "Installed Luna.Notify.exe missing" }
          $regValue = (Get-ItemProperty -Path $runKey -Name "RusklimatIM.LunaNotify" -ErrorAction Stop)."RusklimatIM.LunaNotify"
          if ($regValue -notmatch "Luna.Notify.exe") { throw "Autorun registry value missing or incorrect: $regValue" }
          Write-Host "Installed per-user, autorun value present"
          $uninstall = Join-Path $app "unins000.exe"
          if (-not (Test-Path $uninstall)) { throw "Uninstaller missing" }
          $remove = Start-Process -FilePath $uninstall -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($remove.ExitCode -ne 0) { throw "Uninstall failed with code $($remove.ExitCode)" }
          Start-Sleep -Milliseconds 800
          if (Test-Path $exe) { throw "Installed executable remains after uninstall" }
          $regAfter = Get-ItemProperty -Path $runKey -Name "RusklimatIM.LunaNotify" -ErrorAction SilentlyContinue
          if ($null -ne $regAfter) { throw "Autorun registry value remains after uninstall" }
          Write-Host "Uninstall successful, autorun removed"
      - name: SHA256
        shell: pwsh
        run: Get-FileHash bin/Release/Luna.Notify.exe -Algorithm SHA256 | Format-List
      - name: Package EXE
        uses: actions/upload-artifact@v4
        with:
          name: Luna-Notify-Installer-Windows
          path: |
            installer-output/Luna-Notify-Setup-0.9.0.exe
            bin/Release/Luna.Notify.exe
          if-no-files-found: error
          retention-days: 7
